spring.application.name=springexam
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/springexam
spring.datasource.username=springexam
spring.datasource.password=springexam
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Starts infra/docker-compose.yml (Postgres) when running the backend locally.
spring.docker.compose.file=../infra/docker-compose.yml
spring.docker.compose.lifecycle-management=start-and-stop
